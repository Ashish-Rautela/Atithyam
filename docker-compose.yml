# Local Postgres 16 + PostGIS for development and tests.
#   npm run db:up     → starts it on localhost:5432 (user rip / password rip, databases rip and rip_test)
#   npm run db:down   → stops it (data is kept in the "rip-pgdata" volume)
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: rip-postgres
    environment:
      POSTGRES_USER: rip
      POSTGRES_PASSWORD: rip
      POSTGRES_DB: rip
    ports:
      - "5432:5432"
    volumes:
      - rip-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rip -d rip"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  rip-pgdata:
